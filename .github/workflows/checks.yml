name: Checks

# The expensive checks of the private code repository pocketgpu/pocketgpu, run here because a
# public repository's runners cost no Actions minutes (Windows and macOS count 2× and 10×
# there). The source of this file is .github/releases-repo/checks.yml in the code repository,
# copied here by releases-sync.yml there: edit it there, not here.
#
#   agent-windows  the agent's clippy and tests on Windows (F21)
#   agent-macos    the same on Apple silicon (F26), with the GPU readings printed
#   ios-smoke      the unsigned simulator build opened in an iPhone simulator: it must stay up
#                  30 seconds without a crash report (.github/ios/smoke.sh), then driven with
#                  Appium against an agent on the Mac (.github/ios/e2e.sh, not yet counted)
#   android-e2e    the debug app in an emulator against a Linux agent on the runner (fake GPU,
#                  fake power commands): pairing, live stats, a second device's notice and
#                  revoke, power off by default and a restart cancelled at the computer
#                  (app/e2e/android.mjs and .github/android/ in the code repository)
#
# Nightly on main, and by hand on any branch or commit (Actions → Checks → Run workflow).
# Needs the secret SOURCE_TOKEN (fine-grained token, Contents: read on pocketgpu/pocketgpu).
# Run logs are public: nothing here uploads GitHub artifacts or prints secrets; the e2e check keeps
# its screenshots and logs on the runner except the screens and videos it sends to the push
# server for the admin page (.github/media-upload.sh, secret PUSH_CHECKS_TOKEN, optional), and every build and test runs through
# .github/quiet.sh (PGPU_QUIET), which prints pass or fail and an error's headlines but never
# the lines of code a compiler error quotes. Started and read from the admin page's Checks.
run-name: Checks · ${{ inputs.ref || 'main (nightly)' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in pocketgpu/pocketgpu
        required: true
        default: main
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  PGPU_QUIET: '1'
  REF: ${{ inputs.ref || 'main' }}

jobs:
  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
      - name: Clippy
        shell: bash
        run: bash .github/quiet.sh cargo clippy -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: bash .github/quiet.sh cargo nextest run -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --no-tests=pass
        env:
          PGPU_FAKE_GPU: "1"

  agent-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
      - name: Clippy
        shell: bash
        run: bash .github/quiet.sh cargo clippy -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: bash .github/quiet.sh cargo nextest run -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --no-tests=pass
        env:
          PGPU_FAKE_GPU: "1"
      - name: Apple GPU readings
        run: bash .github/quiet.sh cargo test -p pocketgpu --lib collect::apple

  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # The agent and the stand-in phone, for the runner itself, in their own folder: the
      # Android build restores its cache over target/ afterwards.
      - name: Agent and stand-in phone
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dbus
          bash .github/quiet.sh cargo build -p pocketgpu -p pocketgpu-client --bin pocketgpu --example fake_phone --target-dir e2e-target
      - uses: ./.github/android
        with:
          script: sh app/e2e/run.sh "$APK"
      # The test's screens and video, for the admin page's run view (push server, 14 days).
      - name: Send the screens and video to the admin page
        if: always()
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
        run: sh .github/media-upload.sh android e2e-out

  ios-smoke:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PGPU_DEFAULT_RELAYS: ${{ vars.PGPU_DEFAULT_RELAYS }}
      PGPU_PUSH_URL: ${{ vars.PGPU_PUSH_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: ios-simulator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: brew install xcodegen
      - run: bash ../.github/quiet.sh npm ci
        working-directory: app
      - name: Generate the Xcode project
        working-directory: app
        run: bash ../.github/quiet.sh npx tauri ios init --ci --skip-targets-install
      - run: ruby src-tauri/ios/add-widgets.rb
        working-directory: app
      - name: Build the simulator app (unsigned)
        working-directory: app
        run: bash ../.github/quiet.sh npx tauri ios build --ci --no-sign --target aarch64-sim
      - name: Open it in a simulator
        run: |
          app=$(find app/src-tauri/gen/apple/build -name '*.app' -not -path '*.appex/*' | head -n1)
          [ -n "$app" ] || { echo "::error::no .app was built"; exit 1; }
          sh .github/ios/smoke.sh "$app"
      # Appium drives the app against an agent on this Mac (.github/ios/e2e.sh). Still being
      # built up, so its result is shown in the log and the admin's screens but doesn't fail the
      # check; the scripts come from the code that was checked out, so they change without
      # touching this file.
      - name: Drive the app (not yet counted)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          app=$(find app/src-tauri/gen/apple/build -name '*.app' -not -path '*.appex/*' | head -n1)
          bash .github/ios/e2e.sh "$app"
      - name: Send the screens and video to the admin page
        if: always()
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
        run: sh .github/media-upload.sh ios e2e-out
