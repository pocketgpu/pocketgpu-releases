name: Checks

# Every check of the private code repository pocketgpu/pocketgpu, run here because a public
# repository's runners cost no Actions minutes; the code repository runs no CI of its own. The
# source of this file is .github/releases-repo/checks.yml in the code repository, copied here
# by releases-sync.yml there: edit it there, not here.
#
#   rust           the whole Rust workspace: cargo fmt, clippy -D warnings and every test
#   web            the app's UI, the website and the admin page: lint, types and unit tests
#   agent-windows  the agent's clippy and tests on Windows (F21)
#   agent-macos    the same on Apple silicon (F26), with the GPU readings printed
#   ios-smoke      the unsigned simulator build opened in an iPhone simulator: it must stay up
#                  30 seconds without a crash report (.github/ios/smoke.sh), then driven with
#                  Appium against an agent on the Mac through the same steps as android-e2e
#                  (.github/ios/e2e.sh, app/e2e/ios.mjs)
#   android-e2e    the debug app in an emulator against a Linux agent on the runner (fake GPU,
#                  fake power commands): pairing, live stats, a second device's notice and
#                  revoke, power off by default and a restart cancelled at the computer
#                  (app/e2e/android.mjs and .github/android/ in the code repository)
#   mac-app-e2e    the Mac app (a debug build) on a Mac against an agent on the same Mac, driven
#                  with Appium's Mac2 driver: the first screen, pairing by code and live stats,
#                  filmed from start to end (.github/mac-app/, app/e2e/mac.mjs). In Devices and
#                  Everything, not in Fast.
#
# A run first works out what to test (`plan`, .github/checks-plan.mjs in the code repository, with
# the admin page's settings: the CHECKS_SETTINGS variable here). The files the change touches
# are grouped into parts, each test is ticked for some parts, and each tier has its tests:
#   fast        every push to a branch: the quick tests the change needs (web, rust, windows, mac)
#   devices     a merge to main that touched the app's parts: android, ios and macapp, each with
#               a second try when the admin page's switch is on
#   everything  each night on main, and before a release: every test
#   none        by hand: every test the change needs, all of them, or a picked list (`tests`)
# The run's name says what it is and what started it: "Checks · <ref> · <tier> · <reason>", the
# reason one of push, merge, nightly, release gate, by hand (no tier: "Checks · <ref> · by hand").
#
# Started by themselves: start-checks.yml here looks at the code repository's branches every few
# minutes and starts `fast · push` for a branch that moved and `fast · merge` for main, whose
# plan starts `devices · merge` beside it when the merge needs it; the schedule below is the
# nightly run. By hand: the admin page's Checks, or Actions → Checks → Run workflow.
# A push's run is cancelled by the run of the next push to the same branch; other runs finish.
#
# Already tested: a test that passes leaves a small cache entry here, named after the content of
# the files it covers (`report`). A later run whose files are the same for that test skips it
# and says so in its summary and as a step of `plan` ("Already tested: Web"). Only passes are
# kept, for a week, and one is forgotten when the same files fail; nightly runs, release gates,
# `tests: all` or a list, and `fresh: true` always test for real.
#
# On the commit: `plan` and `report` set a commit status in the code repository ("PocketGPU
# Checks (fast)": running, passed, failed) when SOURCE_TOKEN may; without that they say so and
# go on (admin/docs/owner-todo.md in the code repository, Checks).
#
# Needs the secret SOURCE_TOKEN (fine-grained token, Contents: read on pocketgpu/pocketgpu;
# with Commit statuses: read and write it also reports to the commit).
# Run logs are public: nothing here uploads GitHub artifacts or prints secrets; the e2e check keeps
# its screenshots and logs on the runner except the screens, screen text and films it sends to the push
# server for the admin page (.github/media-upload.sh, secret PUSH_CHECKS_TOKEN, optional), and every build and test runs through
# .github/quiet.sh (PGPU_QUIET), which prints pass or fail and an error's headlines but never
# the lines of code a compiler error quotes. Started and read from the admin page's Checks.
run-name: >-
  Checks · ${{ inputs.ref || 'main' }}${{ github.event_name == 'schedule' && ' · everything · nightly' || format('{0} · {1}', (inputs.tier && inputs.tier != 'none') && format(' · {0}', inputs.tier) || '', inputs.reason || 'by hand') }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in pocketgpu/pocketgpu
        required: true
        default: main
      tests:
        description: auto (what the change needs), all, or a list such as web,android
        required: false
        default: auto
      tier:
        description: With tests auto, the tier whose tests run; none for every test the change needs
        type: choice
        options: [none, fast, devices, everything]
        default: none
      reason:
        description: What started the run (it ends the run's name)
        type: choice
        options: [by hand, push, merge, nightly, release gate]
        default: by hand
      base:
        description: For a merge, the commit main was at before it (empty for the commit's parent)
        required: false
        default: ''
      fresh:
        description: Test for real, also what already passed with the same files
        type: boolean
        default: false
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# A push's run gives way to the run of the next push to the same branch and tier; every other
# run (a merge, the nightly run, a release gate, by hand) is left to finish.
concurrency:
  group: checks-${{ inputs.reason == 'push' && format('{0}-{1}', inputs.ref, inputs.tier) || github.run_id }}
  cancel-in-progress: ${{ inputs.reason == 'push' }}

env:
  CARGO_TERM_COLOR: never
  PGPU_QUIET: '1'
  REF: ${{ inputs.ref || 'main' }}

jobs:
  # Which tests this run needs; every other job runs only when its answer here is true.
  plan:
    runs-on: ubuntu-latest
    # actions: the earlier passes are read from this repository's caches, and a merge's Fast run
    # starts the Devices run.
    permissions:
      contents: read
      actions: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tier: ${{ steps.plan.outputs.tier }}
      testing: ${{ steps.plan.outputs.testing }}
      reused: ${{ steps.plan.outputs.reused }}
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      windows: ${{ steps.plan.outputs.windows }}
      mac: ${{ steps.plan.outputs.mac }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      macapp: ${{ steps.plan.outputs.macapp }}
      key_rust: ${{ steps.plan.outputs.key_rust }}
      key_web: ${{ steps.plan.outputs.key_web }}
      key_windows: ${{ steps.plan.outputs.key_windows }}
      key_mac: ${{ steps.plan.outputs.key_mac }}
      key_android: ${{ steps.plan.outputs.key_android }}
      key_ios: ${{ steps.plan.outputs.key_ios }}
      key_macapp: ${{ steps.plan.outputs.key_macapp }}
      second_try: ${{ steps.plan.outputs.second_try }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ env.REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Every test checks out this commit, not the branch: the branch may move while they run,
      # and a pass is remembered for exactly these files.
      - name: The commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A commit from before the plan existed runs everything; one from before the tiers plans
      # without them, so its Fast run leaves out the app tests here and its Devices run the rest.
      - name: What this change needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TESTS: ${{ inputs.tests || 'auto' }}
          TIER: ${{ github.event_name == 'schedule' && 'everything' || inputs.tier || 'none' }}
          REASON: ${{ github.event_name == 'schedule' && 'nightly' || inputs.reason || 'by hand' }}
          BASE: ${{ inputs.base }}
          FRESH: ${{ inputs.fresh }}
          CHECKS_SETTINGS: ${{ vars.CHECKS_SETTINGS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/plan.txt"
          if [ -f .github/checks-plan.mjs ]; then
            node .github/checks-plan.mjs > "$out"
          else
            # Not the Mac app check: its scripts (.github/mac-app/) came after the plan.
            printf '%s=true\n' rust web windows mac android ios second_try > "$out"
            echo "This commit has no plan yet, so it runs all but the Mac app." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if ! grep -q '^tiers=true$' "$out"; then
            case "$TIER" in
              fast) sed -i -E 's/^(android|ios|macapp)=.*/\1=false/' "$out" ;;
              devices) sed -i -E 's/^(rust|web|windows|mac)=.*/\1=false/' "$out" ;;
            esac
            printf 'tier=%s\n' "$TIER" >> "$out"
          fi
          if grep -qE '^(rust|web|windows|mac|android|ios|macapp)=true$' "$out"; then
            echo "testing=true" >> "$out"
          fi
          cat "$out" >> "$GITHUB_OUTPUT"
      # One step per test whose earlier pass is reused (the others are skipped): the admin page
      # tells a reused test from one that wasn't needed by these steps.
      - name: 'Already tested: Web'
        if: steps.plan.outputs.reused_web == 'true'
        run: echo "Web passed with these same files before; its result is reused."
      - name: 'Already tested: Rust'
        if: steps.plan.outputs.reused_rust == 'true'
        run: echo "Rust passed with these same files before; its result is reused."
      - name: 'Already tested: Windows'
        if: steps.plan.outputs.reused_windows == 'true'
        run: echo "Windows passed with these same files before; its result is reused."
      - name: 'Already tested: Mac'
        if: steps.plan.outputs.reused_mac == 'true'
        run: echo "Mac passed with these same files before; its result is reused."
      - name: 'Already tested: Android'
        if: steps.plan.outputs.reused_android == 'true'
        run: echo "Android passed with these same files before; its result is reused."
      - name: 'Already tested: iPhone'
        if: steps.plan.outputs.reused_ios == 'true'
        run: echo "iPhone passed with these same files before; its result is reused."
      - name: 'Already tested: Mac app'
        if: steps.plan.outputs.reused_macapp == 'true'
        run: echo "Mac app passed with these same files before; its result is reused."
      # A merge that touched the app's parts: Devices runs beside this run, as a run of its own.
      - name: Start the Devices tier
        if: steps.plan.outputs.start_devices == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.plan.outputs.base }}
        run: |
          gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f "ref=$REF" -f tier=devices -f reason=merge -f "base=$BASE" ||
            { echo "::warning::Couldn't start the Devices run for this merge."; exit 1; }
      # On the commit and its pull request: "running" while tests run (`report` says how they
      # went), or at once that everything was already tested. Nothing when no test is needed.
      - name: Tell the commit
        if: steps.plan.outputs.testing == 'true' || steps.plan.outputs.reused != ''
        env:
          STATUS_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          TIER: ${{ steps.plan.outputs.tier }}
          TESTING: ${{ steps.plan.outputs.testing }}
        run: |
          context="PocketGPU Checks"
          [ "$TIER" = none ] || context="$context ($TIER)"
          state=success
          text="already tested: result reused"
          if [ "$TESTING" = true ]; then
            state=pending
            text=running
          fi
          body=$(jq -n --arg s "$state" --arg c "$context" --arg d "$text" \
            --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $s, context: $c, description: $d, target_url: $u}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
            -H "authorization: Bearer $STATUS_TOKEN" -H 'accept: application/vnd.github+json' \
            -d "$body" "https://api.github.com/repos/pocketgpu/pocketgpu/statuses/$SHA" 2>/dev/null) || code=000
          if [ "$code" = 201 ]; then
            echo "On the commit: $context, $text."
          else
            echo "Not on the commit (HTTP $code): SOURCE_TOKEN may not set commit statuses yet."
          fi

  agent-windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
        id: nextest
        continue-on-error: true
      - if: steps.nextest.outcome == 'failure'
        shell: bash
        run: sleep 60
      - if: steps.nextest.outcome == 'failure'
        uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest, again
      - name: Clippy
        shell: bash
        run: bash .github/quiet.sh cargo clippy -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: bash .github/quiet.sh cargo nextest run -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --no-tests=pass
        env:
          PGPU_FAKE_GPU: "1"

  agent-macos:
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
        id: nextest
        continue-on-error: true
      - if: steps.nextest.outcome == 'failure'
        shell: bash
        run: sleep 60
      - if: steps.nextest.outcome == 'failure'
        uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest, again
      - name: Clippy
        shell: bash
        run: bash .github/quiet.sh cargo clippy -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: bash .github/quiet.sh cargo nextest run -p pocketgpu -p pocketgpu-proto -p pocketgpu-client --no-tests=pass
        env:
          PGPU_FAKE_GPU: "1"
      - name: Apple GPU readings
        run: bash .github/quiet.sh cargo test -p pocketgpu --lib collect::apple

  # The whole Rust workspace, the Tauri app included (it embeds the built web UI): formatting,
  # clippy with warnings as errors, and every test.
  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Tauri system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
        id: nextest
        continue-on-error: true
      - if: steps.nextest.outcome == 'failure'
        run: sleep 60
      - if: steps.nextest.outcome == 'failure'
        uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest, again
      # The lockfiles are written by npm 11; the runner's default npm 10 rejects them.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the UI the Tauri crate embeds
        working-directory: app
        shell: bash
        run: |
          bash ../.github/quiet.sh npm ci
          bash ../.github/quiet.sh npm run build
      - name: Format
        shell: bash
        run: bash .github/quiet.sh cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: bash .github/quiet.sh cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: bash .github/quiet.sh cargo nextest run --workspace --no-tests=pass
        env:
          PGPU_FAKE_GPU: "1"

  # The phone and desktop app's UI, the website and the admin page: formatting and lint, types,
  # and unit tests.
  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
            admin/package-lock.json
      - name: Install
        shell: bash
        run: |
          for p in app web admin; do
            (cd "$p" && bash ../.github/quiet.sh npm ci)
          done
      # Only the locked version: `npx` would otherwise fetch whatever npm serves.
      - name: Browser for the app's tests
        working-directory: app
        shell: bash
        run: bash ../.github/quiet.sh npx --no-install playwright install --with-deps chromium
      - name: App
        working-directory: app
        shell: bash
        run: |
          bash ../.github/quiet.sh npm run lint
          bash ../.github/quiet.sh npm run check
          bash ../.github/quiet.sh npm test
      - name: Website
        working-directory: web
        shell: bash
        run: |
          bash ../.github/quiet.sh npm run lint
          bash ../.github/quiet.sh npm run check
          bash ../.github/quiet.sh npm test
      - name: Admin page
        working-directory: admin
        shell: bash
        run: |
          bash ../.github/quiet.sh npm run lint
          bash ../.github/quiet.sh npm run check
          bash ../.github/quiet.sh npm test

  android-e2e:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECOND_TRY: ${{ needs.plan.outputs.second_try }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # The agent and the stand-in phone, for the runner itself, in their own folder: the
      # Android build restores its cache over target/ afterwards.
      - name: Agent and stand-in phone
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dbus
          # ffmpeg joins the film's pieces (.github/android/record.sh).
          command -v ffmpeg >/dev/null || sudo apt-get install -y -q --no-install-recommends ffmpeg >/dev/null || echo "::warning::no ffmpeg: the film will be its first 3 minutes"
          bash .github/quiet.sh cargo build -p pocketgpu -p pocketgpu-client --bin pocketgpu --example fake_phone --target-dir e2e-target
      # A failed check starts over once with the app's data cleared and a new agent when the
      # admin page's "Give phone tests a second try" is on (app/e2e/second-try.sh).
      - uses: ./.github/android
        with:
          script: sh app/e2e/run.sh "$APK" || sh app/e2e/second-try.sh "$APK"
      - name: Second try
        if: hashFiles('e2e-second-try') != ''
        run: echo "The first try failed; the second passed."
      # A film still going (the emulator step timed out) is joined from the pieces it has.
      - name: Stop the film
        if: always()
        timeout-minutes: 5
        run: bash .github/android/record.sh stop
      # The test's screens, screen text, films (android.mp4, android-try2.mp4) and their step
      # times, for the admin page's run view (push server, 14 days).
      - name: Send the screens to the admin page
        if: always()
        timeout-minutes: 15
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
        run: sh .github/media-upload.sh android e2e-out

  ios-smoke:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PGPU_DEFAULT_RELAYS: ${{ vars.PGPU_DEFAULT_RELAYS }}
      PGPU_PUSH_URL: ${{ vars.PGPU_PUSH_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # The built app is kept by the app's code: a run that changes none of it (the e2e check's
      # own scripts, say) reuses it and skips the long build. The Mac session (mac-session.yml,
      # .github/mac/build.sh) builds the same app under the same key: change them together.
      - name: Reuse a built iPhone app
        id: ios-app
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios-app
          key: ios-app-e2e-${{ hashFiles('app/src/**', 'app/static/**', 'app/src-tauri/**', 'app/package-lock.json', 'app/*.json', 'app/*.ts', 'app/*.js', 'crates/proto/**', 'crates/client/**', 'Cargo.lock', 'Cargo.toml', 'patches/**') }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: ios-simulator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.ios-app.outputs.cache-hit != 'true'
        run: brew install xcodegen
      - if: steps.ios-app.outputs.cache-hit != 'true'
        run: bash ../.github/quiet.sh npm ci
        working-directory: app
      - name: Generate the Xcode project
        if: steps.ios-app.outputs.cache-hit != 'true'
        working-directory: app
        run: bash ../.github/quiet.sh npx tauri ios init --ci --skip-targets-install
      - if: steps.ios-app.outputs.cache-hit != 'true'
        run: ruby src-tauri/ios/add-widgets.rb
        working-directory: app
      # With the feature `e2e`, the web view can be inspected, which is how Appium reaches the
      # page; this build is only ever used here.
      - name: Build the simulator app (unsigned)
        if: steps.ios-app.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          bash ../.github/quiet.sh npx tauri ios build --ci --no-sign --target aarch64-sim --features e2e
          app=$(find src-tauri/gen/apple/build -name '*.app' -not -path '*.appex/*' | head -n1)
          [ -n "$app" ] || { echo "::error::no .app was built"; exit 1; }
          mkdir -p ../ios-app && cp -R "$app" ../ios-app/PocketGPU.app
      - if: steps.ios-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios-app
          key: ${{ steps.ios-app.outputs.cache-primary-key }}
      - name: Open it in a simulator
        run: sh .github/ios/smoke.sh ios-app/PocketGPU.app
      # The agent and stand-in phone the e2e check builds, and the driver's test runner, kept
      # between runs: together about 4 minutes of building (.github/ios/e2e.sh).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: e2e-target
          key: ios-e2e-target-${{ hashFiles('Cargo.lock', 'crates/**') }}
          restore-keys: ios-e2e-target-
      # A test runner built with another Xcode may not start: the version is part of its key.
      - id: xcode
        run: echo "version=$(xcodebuild -version | head -n1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/wda
          key: wda-${{ steps.xcode.outputs.version }}-${{ hashFiles('.github/ios/e2e.sh') }}
      # Appium drives the app against an agent on this Mac (.github/ios/e2e.sh): pairing, live
      # stats, a second device revoked, power off by default and a restart cancelled, filmed
      # (e2e-out/ios.mp4, .github/ios/record.sh). The scripts come from the code that was
      # checked out, so they change without touching this file.
      - name: Drive the app
        id: drive
        timeout-minutes: 28
        continue-on-error: ${{ needs.plan.outputs.second_try == 'true' }}
        run: bash .github/ios/e2e.sh ios-app/PocketGPU.app ios.mp4
      # A simulator sometimes misses a tap: with the admin page's "Give phone tests a second
      # try" on, a failed check starts over once, with the app reinstalled and a new agent
      # (PGPU_DATA_DIR). The first try's film goes with the run; its screens stay in
      # e2e-out-first on the runner.
      - name: Second try
        if: steps.drive.outcome == 'failure'
        timeout-minutes: 28
        env:
          PGPU_DATA_DIR: ${{ runner.temp }}/pgpu-second-try
        run: |
          bash .github/ios/record.sh stop
          rm -rf e2e-out-first && mv e2e-out e2e-out-first || true
          mkdir -p e2e-out
          cp e2e-out-first/ios.mp4 e2e-out-first/ios-steps.txt e2e-out/ 2>/dev/null || true
          xcrun simctl uninstall booted app.pocketgpu || true
          xcrun simctl install booted ios-app/PocketGPU.app
          bash .github/ios/e2e.sh ios-app/PocketGPU.app ios-try2.mp4
      # A film still running (a step that timed out) is finished here, before it is sent.
      - name: Stop the film
        if: always()
        timeout-minutes: 3
        run: bash .github/ios/record.sh stop
      - name: Send the screens and the films to the admin page
        if: always()
        timeout-minutes: 15
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
        run: sh .github/media-upload.sh ios e2e-out

  # The Mac app on a Mac (.github/mac-app/README.md in the code repository): the debug build
  # driven with Appium's Mac2 driver against an agent on this Mac, filmed from start to end.
  mac-app-e2e:
    needs: plan
    if: needs.plan.outputs.macapp == 'true'
    runs-on: macos-15
    timeout-minutes: 140
    env:
      PGPU_DEFAULT_RELAYS: ${{ vars.PGPU_DEFAULT_RELAYS }}
      PGPU_PUSH_URL: ${{ vars.PGPU_PUSH_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # The built app is kept by the app's code, like the iPhone app: a run that changes none of
      # it (the check's own scripts, say) reuses it and skips the long build.
      - name: Reuse a built Mac app
        id: mac-app
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac-app
          key: mac-app-e2e-debug-${{ hashFiles('app/src/**', 'app/static/**', 'app/src-tauri/**', 'app/package-lock.json', 'app/*.json', 'app/*.ts', 'app/*.js', 'crates/proto/**', 'crates/client/**', 'Cargo.lock', 'Cargo.toml', 'patches/**') }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The app's Rust build, only when it is built here.
      - if: steps.mac-app.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: mac-app-debug
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # A debug build as an .app, without the .dmg (the slow and flaky part of a release build).
      - name: Build the Mac app (debug, unsigned)
        if: steps.mac-app.outputs.cache-hit != 'true'
        timeout-minutes: 45
        working-directory: app
        run: |
          bash ../.github/quiet.sh npm ci
          bash ../.github/quiet.sh npx tauri build --debug --bundles app
          app=$(find ../target/debug/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          [ -n "$app" ] || { echo "::error::no .app was built"; exit 1; }
          mkdir -p ../mac-app && cp -R "$app" ../mac-app/PocketGPU.app
      - if: steps.mac-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mac-app
          key: ${{ steps.mac-app.outputs.cache-primary-key }}
      # The agent and stand-in phone: the same build, and so the same cache, as the iPhone
      # check's (ios-smoke), on the same kind of Mac.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: e2e-target
          key: ios-e2e-target-${{ hashFiles('Cargo.lock', 'crates/**') }}
          restore-keys: ios-e2e-target-
      # The Mac2 driver's test runner, built by Xcode at the first session: kept per Xcode and
      # driver version (pinned in prepare.sh).
      - id: xcode
        run: echo "version=$(xcodebuild -version | head -n1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/WebDriverAgentMac-*
          key: wda-mac-${{ steps.xcode.outputs.version }}-${{ hashFiles('.github/mac-app/prepare.sh') }}
      # Keeps the display awake, installs ffmpeg, Appium and the Mac2 driver, puts the app in
      # /Applications, grants the driver and the recorder their privacy permissions and logs
      # what kind of session this job has.
      - name: Prepare the Mac
        timeout-minutes: 15
        run: bash .github/mac-app/prepare.sh mac-app/PocketGPU.app
      # Opens the app, pairs it by code with an agent on this Mac, waits for live stats, removes
      # a second device, cancels a restart, saves a file and uses the clipboard, filmed
      # (e2e-out/mac.mp4).
      - name: Drive the app
        id: drive
        timeout-minutes: 38
        continue-on-error: ${{ needs.plan.outputs.second_try == 'true' }}
        run: bash .github/mac-app/e2e.sh mac.mp4
      # With the admin page's second try on, a failed check starts over once, with the app's
      # data cleared and a new agent (PGPU_DATA_DIR). The first try's film goes with the run;
      # its screens stay in e2e-out-first on the runner.
      - name: Second try
        if: steps.drive.outcome == 'failure'
        timeout-minutes: 38
        env:
          PGPU_DATA_DIR: ${{ runner.temp }}/pgpu-second-try
        run: |
          rm -rf e2e-out-first && mv e2e-out e2e-out-first || true
          mkdir -p e2e-out
          cp e2e-out-first/mac.mp4 e2e-out-first/mac-steps.txt e2e-out/ 2>/dev/null || true
          bash .github/mac-app/prepare.sh reset
          bash .github/mac-app/e2e.sh mac-try2.mp4
      # A film still running (a step that timed out) is finished here, before it is sent.
      - name: Stop the film
        if: always()
        timeout-minutes: 3
        run: bash .github/mac-app/record.sh stop
      - name: Send the screens and the film to the admin page
        if: always()
        timeout-minutes: 15
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
        run: sh .github/media-upload.sh macapp e2e-out
      # The test runner's cache is saved after the job and the repository is public: it keeps the
      # build only, not the session's test results and logs (what was on screen, keys typed).
      - name: Keep the test runner's logs out of the cache
        if: always()
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/WebDriverAgentMac-*/Logs

  # After the tests. Remembers each test that passed, under the key the plan made from the files
  # it covers, so a later run of the same files can reuse the result; forgets an earlier pass
  # when the same files fail now; and says on the commit and its pull request how the run went.
  # It checks out nothing and never fails the run.
  report:
    needs: [plan, rust, web, agent-windows, agent-macos, android-e2e, ios-smoke, mac-app-e2e]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.testing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: How it went
        id: went
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p passed
          echo "$GITHUB_RUN_ID $(date -u +%FT%TZ)" > passed/run.txt
          forget() {
            gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$1-&per_page=100" \
              --jq '.actions_caches[].id' 2>/dev/null |
              while read -r cache; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache" >/dev/null 2>&1 || true
              done
          }
          passed=''
          failed=''
          stopped=false
          while IFS='|' read -r id job name; do
            result=$(jq -r --arg j "$job" '.[$j].result // ""' <<<"$NEEDS")
            key=$(jq -r --arg k "key_$id" '.plan.outputs[$k] // ""' <<<"$NEEDS")
            case "$result" in
              success)
                passed="$passed, $name"
                [ -z "$key" ] || echo "save_$id=$key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
                ;;
              failure)
                failed="$failed, $name"
                [ -z "$key" ] || forget "$key" || true
                ;;
              cancelled) stopped=true ;;
            esac
          done <<'TESTS'
          web|web|Web
          rust|rust|Rust
          windows|agent-windows|Windows
          mac|agent-macos|Mac
          android|android-e2e|Android
          ios|ios-smoke|iPhone
          macapp|mac-app-e2e|Mac app
          TESTS
          reused=$(jq -r '.plan.outputs.reused // "" | split(",") | map(select(. != "")) | length' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            state=failure
            text="failed: ${failed#, }"
          elif [ "$stopped" = true ]; then
            state=error
            text=cancelled
          else
            state=success
            text="passed: ${passed#, }"
            [ "$reused" = 0 ] || text="$text · $reused already tested"
          fi
          echo "$text"
          { echo "state=$state"; echo "text=$text"; } >> "$GITHUB_OUTPUT"
      - if: steps.went.outputs.save_web
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_web }}
      - if: steps.went.outputs.save_rust
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_rust }}
      - if: steps.went.outputs.save_windows
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_windows }}
      - if: steps.went.outputs.save_mac
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_mac }}
      - if: steps.went.outputs.save_android
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_android }}
      - if: steps.went.outputs.save_ios
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_ios }}
      - if: steps.went.outputs.save_macapp
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed
          key: ${{ steps.went.outputs.save_macapp }}
      - name: Tell the commit
        if: always() && steps.went.outputs.state
        env:
          STATUS_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
          TIER: ${{ needs.plan.outputs.tier }}
          STATE: ${{ steps.went.outputs.state }}
          TEXT: ${{ steps.went.outputs.text }}
        run: |
          context="PocketGPU Checks"
          [ "$TIER" = none ] || context="$context ($TIER)"
          body=$(jq -n --arg s "$STATE" --arg c "$context" --arg d "${TEXT:0:140}" \
            --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $s, context: $c, description: $d, target_url: $u}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
            -H "authorization: Bearer $STATUS_TOKEN" -H 'accept: application/vnd.github+json' \
            -d "$body" "https://api.github.com/repos/pocketgpu/pocketgpu/statuses/$SHA" 2>/dev/null) || code=000
          if [ "$code" = 201 ]; then
            echo "On the commit: $context, $TEXT."
          else
            echo "Not on the commit (HTTP $code): SOURCE_TOKEN may not set commit statuses yet."
          fi
