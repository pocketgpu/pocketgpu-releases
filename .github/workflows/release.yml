name: Release

# Builds and publishes a PocketGPU release from the private code repository pocketgpu/pocketgpu.
# It runs here because a public repository's runners cost no Actions minutes. The source of
# this file is .github/releases-repo/release.yml in the code repository, copied here by
# releases-sync.yml there: edit it there, not here.
#
# Start it with the tag of a commit in the code repository (v1.2.0 or v1.2.0-rc.1): pushing the
# tag there starts it (release-agent.yml), or Actions → Release → Run workflow here. The
# binaries take their version from the tag. Needs, in this repository's settings:
#   secrets   SOURCE_TOKEN          fine-grained token, Contents: read on pocketgpu/pocketgpu
#             MINISIGN_SECRET_KEY   the contents of the minisign secret key
#             MINISIGN_PASSWORD
#   variables PGPU_DEFAULT_RELAYS, PGPU_PUSH_URL (our servers, built into the binaries;
#             empty: n0's public relays and the default push address)
# When it ends, the owner hears how it went on their phone and by email (job `tell`,
# .github/owner-alert.sh, with the secret PUSH_CHECKS_TOKEN that Checks uses; optional).
# Run logs are public: nothing here may print a secret or the source. The desktop app is private
# code, so its builds run through .github/quiet.sh (PGPU_QUIET), which prints pass or fail and an
# error's headlines but never the lines of code a compiler quotes.
# No job here restores a cache: Checks runs every branch's code in this repository and could
# leave a poisoned entry, and these jobs build what users install. Every build starts clean.
run-name: Release ${{ inputs.tag || github.event.client_payload.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in pocketgpu/pocketgpu, like v1.2.0
        required: true
      notes:
        description: What changed; goes at the top of the GitHub release (the admin page drafts it)
        required: false
        default: ''
  repository_dispatch:
    types: [release]

permissions:
  contents: read

# One run per tag; a second start waits rather than publishing twice.
concurrency:
  group: release-${{ inputs.tag || github.event.client_payload.tag }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.client_payload.tag }}
  PGPU_DEFAULT_RELAYS: ${{ vars.PGPU_DEFAULT_RELAYS }}
  PGPU_PUSH_URL: ${{ vars.PGPU_PUSH_URL }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: The tag is a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "tag $TAG is not like v1.2.3 or v1.2.3-rc.1"; exit 1; }

  build:
    needs: version
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            docker: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            docker: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild and zig
        # Pinned: these link the signed Linux binaries.
        run: pip install cargo-zigbuild==0.24.0 ziglang==0.17.0
      # glibc 2.28: one binary for Debian 10+, Ubuntu 18.10+, RHEL 8+. Not musl: NVML is
      # loaded at run time, which a static binary can't do.
      - name: Version from the tag
        shell: bash
        run: sed -i "0,/^version = \".*\"/s//version = \"${TAG#v}\"/" Cargo.toml
      - name: Build
        run: cargo zigbuild --release -p pocketgpu --target ${{ matrix.target }}.2.28
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.docker }}
          cp target/${{ matrix.target }}/release/pocketgpu dist/${{ matrix.docker }}/
          tar -czf pocketgpu-${{ matrix.arch }}-linux.tar.gz -C target/${{ matrix.target }}/release pocketgpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.arch }}
          path: |
            pocketgpu-${{ matrix.arch }}-linux.tar.gz
            dist/

  windows:
    name: Build Windows x86_64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # MSVC with a static C runtime: no Visual C++ redistributable needed.
      - name: Version from the tag
        shell: bash
        run: sed -i "0,/^version = \".*\"/s//version = \"${TAG#v}\"/" Cargo.toml
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p pocketgpu --target x86_64-pc-windows-msvc
      - name: Package
        shell: bash
        run: tar -czf pocketgpu-x86_64-windows.tar.gz -C target/x86_64-pc-windows-msvc/release pocketgpu.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-windows
          path: pocketgpu-x86_64-windows.tar.gz

  # The macOS agent for Apple silicon (F26). Not notarized yet: `curl` doesn't mark downloads
  # as quarantined, so the install script's binary runs; the linker signs it ad hoc.
  macos:
    name: Build macOS aarch64
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Version from the tag
        # Not sed: macOS sed has no `0,/re/` and rejects `s//`. Only the first match changes.
        run: perl -0pi -e 's/^version = ".*"/version = "'"${TAG#v}"'"/m' Cargo.toml
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release -p pocketgpu --target aarch64-apple-darwin
      - name: Package
        run: tar -czf pocketgpu-aarch64-macos.tar.gz -C target/aarch64-apple-darwin/release pocketgpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-macos
          path: pocketgpu-aarch64-macos.tar.gz

  # The desktop app (F31, F34): the phone app built for PCs and laptops. Not shipped since
  # 22 Nov 2026 (the app is phones only; Windows installs the agent with install.ps1). The
  # job stays so it can come back: set `if:` to true. Releases publish without it.
  client:
    name: Build desktop client (${{ matrix.os }})
    if: false
    # The Windows app bundles the agent the windows job built, the same binary as the
    # standalone download, rather than compiling it a second time.
    needs: [version, windows]
    runs-on: ${{ matrix.os }}
    env:
      PGPU_QUIET: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      # No install scripts: none of the app's packages needs one to build.
      - name: Install UI and Tauri CLI
        shell: bash
        run: bash .github/quiet.sh npm ci --prefix app --ignore-scripts
      - name: Version from the tag
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || '' }}
          PGPU_UPDATER_PUBKEY: ${{ vars.PGPU_UPDATER_PUBKEY }}
        run: |
          v="${TAG#v}"
          perl -0pi -e 's/^version = ".*"/version = "'"$v"'"/m' Cargo.toml
          if [ "$RUNNER_OS" = Windows ]; then
            # The Windows app carries the agent and installs it for the user (F34). Not next to
            # PocketGPU.exe: Windows names are case-insensitive, so it would replace the app.
            # With the release key, the app checks its own updates (board 29) against the public
            # key built in (PGPU_UPDATER_PUBKEY, also in the build's config). The installer is
            # built unsigned and signed by the `release` job, so the private key never reaches
            # this build's dependencies.
            updater=false
            if [ -n "$HAS_UPDATER_KEY" ] && [ -n "$PGPU_UPDATER_PUBKEY" ]; then updater=true; fi
            jq -n --arg v "${v%%-*}" --argjson updater "$updater" --arg key "$PGPU_UPDATER_PUBKEY" \
              '{version: $v,
                bundle: {createUpdaterArtifacts: false,
                         resources: {"resources/pocketgpu.exe": "agent/pocketgpu.exe"}}}
               + (if $updater then {plugins: {updater: {pubkey: $key}}} else {} end)' > app/release.json
            cat app/release.json
          else
            printf '{"version":"%s"}' "${v%%-*}" > app/release.json
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: runner.os == 'Windows'
        with:
          name: agent-windows
          path: agent-windows
      - name: The agent to bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p app/src-tauri/resources
          tar -xzf agent-windows/pocketgpu-x86_64-windows.tar.gz -C app/src-tauri/resources pocketgpu.exe
      - name: Build
        shell: bash
        working-directory: app
        env:
          # The desktop app's updates (board 29): the public half of the release key is built
          # into the app. Without it the app simply never offers updates.
          PGPU_UPDATER_PUBKEY: ${{ vars.PGPU_UPDATER_PUBKEY }}
        # Bundling downloads tools from GitHub (NSIS and its plugin on Windows, AppRun on
        # Linux), and those downloads sometimes answer 504 for a few minutes, so a failed build
        # tries again, up to four times, a minute more apart each time. It doesn't look for the
        # error's text: on Windows that never reached the piped output, and v1.2.29 stopped after
        # one 504. The app compiles once; a retry only bundles again, and a real compile error
        # fails the same way each time.
        run: |
          for i in 1 2 3 4; do
            bash ../.github/quiet.sh npx tauri build --bundles ${{ matrix.bundles }} --config release.json && exit 0
            [ "$i" = 4 ] && exit 1
            echo "::warning::Building the desktop app failed (try $i of 4), most likely a download; again in $((i * 60)) s"
            sleep $((i * 60))
          done
      - name: Collect
        shell: bash
        run: |
          b=target/release/bundle
          case "$RUNNER_OS" in
            Windows) cp $b/nsis/*-setup.exe PocketGPU-x86_64-setup.exe ;;
            Linux)
              cp $b/deb/*.deb PocketGPU-amd64.deb
              cp $b/appimage/*.AppImage PocketGPU-x86_64.AppImage ;;
            macOS) cp $b/dmg/*.dmg PocketGPU-aarch64.dmg ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-client-${{ runner.os }}
          path: |
            PocketGPU-x86_64-setup.exe
            PocketGPU-amd64.deb
            PocketGPU-x86_64.AppImage
            PocketGPU-aarch64.dmg
          if-no-files-found: ignore

  release:
    needs: [build, windows, macos, client]
    # The Linux and Mac desktop apps are betas, and the macOS agent is not tried on a real Mac
    # yet: publish when the Linux and Windows agents pass, whatever those did. The Windows app
    # is checked below, before anything is published. `!cancelled()` rather than `always()`:
    # cancelling a run must stop it signing and publishing.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          merge-multiple: true
      # The Windows installer signed for the app's own updates (board 29), here rather than in
      # the build: this job runs none of the app's dependencies, and the signer is a pinned Tauri
      # CLI installed without scripts. The signature is checked against the public key built
      # into the app before anything is published. No key: no updates offered, as before.
      - name: Sign the Windows app for its updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PGPU_UPDATER_PUBKEY: ${{ vars.PGPU_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          # No desktop app in this release (see the client job): nothing to sign.
          if [ ! -f PocketGPU-x86_64-setup.exe ]; then exit 0; fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$PGPU_UPDATER_PUBKEY" ]; then
            echo "No updater key: the Windows app is published without update signing."
            exit 0
          fi
          signer="$RUNNER_TEMP/signer"
          npm install --silent --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            --prefix "$signer" @tauri-apps/cli@2.12.4
          "$signer/node_modules/.bin/tauri" signer sign PocketGPU-x86_64-setup.exe > /dev/null
          rm -rf "$signer"
          sudo apt-get update -q && sudo apt-get install -y -q minisign > /dev/null
          check="$RUNNER_TEMP/sigcheck" && mkdir -p "$check"
          printf '%s' "$PGPU_UPDATER_PUBKEY" | base64 -d > "$check/key.pub"
          base64 -d PocketGPU-x86_64-setup.exe.sig > "$check/setup.minisig"
          minisign -Vq -p "$check/key.pub" -m PocketGPU-x86_64-setup.exe -x "$check/setup.minisig" ||
            { echo "::error::The update signature doesn't match the public key built into the app."; exit 1; }
          rm -rf "$check"
          echo "Signed for updates."
      # The desktop app's update manifest (board 29), when the Windows installer was signed.
      - name: latest.json
        run: |
          if [ -f PocketGPU-x86_64-setup.exe.sig ]; then
            v="${TAG#v}"
            jq -n --arg v "${v%%-*}" --arg sig "$(cat PocketGPU-x86_64-setup.exe.sig)" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/PocketGPU-x86_64-setup.exe" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: "See the release notes on GitHub.", pub_date: $date,
                platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
            rm PocketGPU-x86_64-setup.exe.sig
            cat latest.json
          fi
      - name: Checksums
        run: |
          shopt -s nullglob
          sha256sum pocketgpu-*.tar.gz PocketGPU-* > SHA256SUMS && cat SHA256SUMS
      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m SHA256SUMS
          rm minisign.key
      # GitHub's own CLI rather than a third-party action, which would see the token. The tag
      # is created here, on this repository's default branch.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          : > notes.md
          if [ -n "$RELEASE_NOTES" ]; then printf '%s\n\n' "$RELEASE_NOTES" > notes.md; fi
          cat >> notes.md <<'NOTES'
          Install: `curl -fsSL https://pocketgpu.app/install | sh` (Linux, Apple silicon Macs) or
          `irm https://pocketgpu.app/install.ps1 | iex` (Windows). Update: `pgpu update`.
          The desktop app is no longer shipped: use the phone app. Desktop apps already installed
          keep working without updates.
          Files are listed in SHA256SUMS, signed with minisign (SHA256SUMS.minisig).
          NOTES
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          shopt -s nullglob
          files=(pocketgpu-*.tar.gz PocketGPU-* SHA256SUMS SHA256SUMS.minisig latest*.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun after a build failed: add what was missing and replace the rest, the
            # checksums and their signature included.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "PocketGPU $TAG" --notes-file notes.md $pre "${files[@]}"
          fi

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/pocketgpu/pocketgpu
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The installer downloads cosign from GitHub, which sometimes answers 504 for a few
      # minutes: up to three tries, a minute apart, before the image goes unsigned.
      - id: cosign1
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        continue-on-error: true
      - if: steps.cosign1.outcome == 'failure'
        run: sleep 60
      - id: cosign2
        if: steps.cosign1.outcome == 'failure'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        continue-on-error: true
      - if: steps.cosign1.outcome == 'failure' && steps.cosign2.outcome == 'failure'
        run: sleep 60
      - if: steps.cosign1.outcome == 'failure' && steps.cosign2.outcome == 'failure'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/pocketgpu/pocketgpu@${{ steps.push.outputs.digest }}

  # Tells the owner how the release went, on their phone and by email (the admin page's Alerts
  # to you says which): published, or what stopped it. The alert script is the one file fetched
  # from the code repository's main; it prints an HTTP code only. Nothing here can fail the run,
  # and a cancelled run tells nothing.
  tell:
    name: Tell the owner
    needs: [version, build, windows, macos, client, release, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          path: alert-script
          sparse-checkout: .github/owner-alert.sh
          sparse-checkout-cone-mode: false
      - name: Tell the owner
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ ! -f alert-script/.github/owner-alert.sh ]; then
            echo "main has no alert script yet: nothing sent."
            exit 0
          fi
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          if [ "$(jq -r '.release.result' <<<"$NEEDS")" = success ]; then
            kind=release_finished
            text="Agent and desktop app $TAG are published."
            [ -z "$failed" ] || text="$text Failed beside it: $failed."
          else
            kind=release_failed
            text="Agent and desktop app $TAG were not published."
            [ -z "$failed" ] || text="$text Failed: $failed."
          fi
          sh alert-script/.github/owner-alert.sh "$kind" "$text Tap to open the run."
