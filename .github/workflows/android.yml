name: Android

# Builds the signed Android App Bundle of the phone app from the private code repository
# pocketgpu/pocketgpu and uploads it straight to Google Play. It runs here because a public
# repository's runners cost no Actions minutes. The source of this file is
# .github/releases-repo/android.yml in the code repository, copied here by releases-sync.yml
# there: edit it there, not here.
#
# Start it from the admin page's Releases (which fills in every input), or Actions → Android →
# Run workflow. The version is the `version` input, or else app/src-tauri/tauri.conf.json at
# the chosen ref (Google Play needs a higher one each upload).
# The bundle goes to Google Play and nowhere else: it waits between the build and the upload as
# a run artifact for a day at most, and is deleted once uploaded (job `forget`).
# Before beta and production, the app is also opened in an emulator alongside the build (job
# `check`, the same check CI runs: .github/android/ in the code repository), so a crash shows
# up as a failed job on the run — but the upload no longer waits for it or depends on its
# result; check the run (or the admin Checks page) yourself before trusting a release.
# Needs, in this repository's settings:
#   secrets   SOURCE_TOKEN                fine-grained token, Contents: read on pocketgpu/pocketgpu
#             ANDROID_KEYSTORE_BASE64     the upload keystore (.jks), base64-encoded
#             ANDROID_KEYSTORE_PASSWORD
#             ANDROID_KEY_PASSWORD        only if the key's password differs from the keystore's
#             GOOGLE_SERVICES_JSON        google-services.json from Firebase (push)
#             PLAY_SERVICE_ACCOUNT_JSON   a Google Cloud service account key with release access
#                                         to the app in Play Console (Users and permissions)
#   variables ANDROID_KEY_ALIAS (default: upload), PGPU_DEFAULT_RELAYS, PGPU_PUSH_URL
# When it ends, the owner hears how it went on their phone and by email (job `tell`,
# .github/owner-alert.sh, with the secret PUSH_CHECKS_TOKEN that Checks uses; optional).
# Run logs are public: nothing here may print a secret or the source, so the builds run through
# .github/quiet.sh. The bundle job restores no cache (Checks runs every branch's code in this
# repository and could leave a poisoned one) and holds no signing or Play key: the upload key
# and the service account key are only in job `upload`, which runs none of the app's code.
# The admin page reads the version, track and commit back from this title.
run-name: Android ${{ inputs.version || 'from ref' }} → ${{ inputs.track }} · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in pocketgpu/pocketgpu
        required: true
        default: main
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      notes:
        description: Release notes (en-US)
        required: false
        default: ''
      version:
        description: App version, like 1.2.9 (empty - the one in tauri.conf.json)
        required: false
        default: ''

permissions:
  contents: read
  # The upload reads whether the app check passed.
  actions: read

concurrency:
  group: android

env:
  CARGO_TERM_COLOR: always
  # Builds print only headlines here: these logs are public (.github/quiet.sh).
  PGPU_QUIET: '1'
  PGPU_DEFAULT_RELAYS: ${{ vars.PGPU_DEFAULT_RELAYS }}
  PGPU_PUSH_URL: ${{ vars.PGPU_PUSH_URL }}
  PACKAGE: app.pocketgpu
  # The plugin that reads google-services.json; the version the app was first built with.
  GOOGLE_SERVICES_PLUGIN: com.google.gms:google-services:4.4.2

jobs:
  # Beside the bundle build, so it adds little time: the app opened in an emulator must stay
  # open for 30 seconds with no crash in its log. Nothing from it is kept (logs are public).
  check:
    name: App check
    if: inputs.track == 'beta' || inputs.track == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Code without the app check
        if: hashFiles('.github/android/action.yml') == ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "::error::$REF is older than the app check, so it can't go to beta or production from here. Release it to alpha and promote it in Play Console, or release a newer commit."
          exit 1
      - uses: ./.github/android

  bundle:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Version
        id: version
        env:
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version $VERSION is not like 1.2.9"; exit 1; }
            node -e "const f='./app/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          fi
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "Building app version $v from $REF"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # No install scripts: none of the app's packages needs one to build.
      - name: Install UI and Tauri CLI
        run: bash .github/quiet.sh npm ci --prefix app --ignore-scripts
      # The runner has the Android SDK and NDK; the Android project is generated, not committed.
      - name: Generate the Android project
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash ../.github/quiet.sh npx tauri android init --ci
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      # Firebase on top of the template; each edit fails loudly if the template moved.
      - name: Add Firebase
        working-directory: app/src-tauri/gen/android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import os, pathlib, sys

          def edit(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  sys.exit(f"{path}: expected one {old.strip()!r}; the Tauri template changed")
              p.write_text(text.replace(old, new))

          plugin = os.environ["GOOGLE_SERVICES_PLUGIN"]
          edit("build.gradle.kts",
               '        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:',
               f'        classpath("{plugin}")\n'
               '        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:')
          app = pathlib.Path("app/build.gradle.kts")
          app.write_text(app.read_text() + '\napply(plugin = "com.google.gms.google-services")\n')
          PY
      # Unsigned: the upload key signs it in the next job, which runs none of this build's code.
      - name: Build the bundle
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # ARM only: practically every Android phone. The x86 builds are for emulators and a few
          # Chromebooks, and would double the Rust build time.
          bash ../.github/quiet.sh npx tauri android build --aab --ci --target aarch64 --target armv7
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "no .aab was built"; exit 1; }
          echo "AAB=$PWD/$aab" >> "$GITHUB_ENV"
          ls -l "$aab"
      # Kept for a day only, for a rerun of the upload; `forget` deletes it once it is uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-bundle
          path: ${{ env.AAB }}
          if-no-files-found: error
          retention-days: 1

  # Signs the bundle with the upload key and sends it to Google Play, in a job of its own: it
  # checks out no code and runs nothing the build ran, so nothing a dependency left behind
  # (a process, $GITHUB_ENV or $GITHUB_PATH) is here with the keys.
  upload:
    name: Sign and upload
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-bundle
          path: ${{ runner.temp }}/bundle
      # The upload key signs the bundle with the JDK's jarsigner, as Google Play expects. Only
      # whether it verified is printed: the certificate holds the developer's name.
      - name: Sign the bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PGPU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PGPU_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          aab=$(find "$RUNNER_TEMP/bundle" -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::the bundle isn't in the artifact"; exit 1; }
          # The runner image's JDK, by its full path.
          jarsigner="$JAVA_HOME/bin/jarsigner"
          [ -x "$jarsigner" ] || { echo "::error::no jarsigner at \$JAVA_HOME"; exit 1; }
          ks="$RUNNER_TEMP/upload.jks"
          export PGPU_KEY_PASSWORD="${KEY_PASSWORD:-$PGPU_KEYSTORE_PASSWORD}"
          ( umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks" )
          log="$RUNNER_TEMP/sign.log"
          status=0
          "$jarsigner" -keystore "$ks" -storepass:env PGPU_KEYSTORE_PASSWORD \
            -keypass:env PGPU_KEY_PASSWORD "$aab" "$PGPU_KEY_ALIAS" > "$log" 2>&1 || status=$?
          rm -f "$ks"
          if [ "$status" != 0 ]; then
            grep -i 'jarsigner error' "$log" | head -3 || true
            echo "::error::Signing the bundle failed (exit $status)"
            exit 1
          fi
          "$jarsigner" -verify "$aab" > "$log" 2>&1 && grep -q '^jar verified' "$log" ||
            { echo "::error::The signed bundle doesn't verify"; exit 1; }
          rm -f "$log"
          echo "AAB=$aab" >> "$GITHUB_ENV"
          echo "Signed with the upload key."
      # Google's own API through its auth library, rather than a third-party action, which
      # would see the service account key. Wheels only, so installing runs no package's code,
      # and every package, dependencies too, at an exact version with its hash: the process
      # that holds the key imports nothing PyPI happens to serve that day. They go into a venv
      # of their own, so nothing else installed on the runner is imported either.
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_VERSION: ${{ needs.bundle.outputs.version }}
          TRACK: ${{ inputs.track }}
          NOTES: ${{ inputs.notes }}
        run: |
          reqs="$RUNNER_TEMP/play-requirements.txt"
          cat > "$reqs" <<'REQ'
          google-auth==2.40.3 --hash=sha256:1370d4593e86213563547f97a92752fc658456fe4514c809544f330fed45a7ca
          requests==2.32.4 --hash=sha256:27babd3cda2a6d50b30443204ee89830707d396671944c998b5975b031ac2b2c
          cachetools==5.5.2 --hash=sha256:d26a22bcc62eb95c3beabd9f1ee5e820d3d2704fe2967cbe350e20c8ffcd3f0a
          pyasn1-modules==0.4.2 --hash=sha256:29253a9207ce32b64c3ac6600edc75368f98473906e8fd1043bd6b5b1de2c14a
          rsa==4.9.1 --hash=sha256:68635866661c6836b8d39430f97a996acbd61bfa49406748ea243539fe239762
          pyasn1==0.6.5 --hash=sha256:4017b0fce125096b8573b39c989fdb1a4b19cf761e683398184550fea0e66587
          charset-normalizer==3.5.2 --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
          idna==3.20 --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          urllib3==2.8.0 --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
          certifi==2026.10.23 --hash=sha256:e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
          REQ
          py="$RUNNER_TEMP/play-venv"
          python3 -m venv "$py"
          "$py/bin/pip" install --quiet --disable-pip-version-check --require-hashes \
            --only-binary :all: -r "$reqs"
          "$py/bin/python" - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(creds)
          pkg, track = os.environ["PACKAGE"], os.environ["TRACK"]
          api = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}"
          upload = f"https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/{pkg}"

          def check(r, what):
              if not r.ok:
                  raise SystemExit(f"{what} failed: {r.status_code} {r.text}")
              return r.json()

          edit = check(s.post(f"{api}/edits"), "Opening an edit")["id"]
          with open(os.environ["AAB"], "rb") as f:
              code = check(s.post(f"{upload}/edits/{edit}/bundles?uploadType=media", data=f,
                                  headers={"Content-Type": "application/octet-stream"},
                                  timeout=900), "Uploading the bundle")["versionCode"]
          def set_track(status):
              release = {"name": os.environ["APP_VERSION"], "versionCodes": [str(code)],
                         "status": status}
              if os.environ.get("NOTES"):
                  release["releaseNotes"] = [{"language": "en-US", "text": os.environ["NOTES"]}]
              check(s.put(f"{api}/edits/{edit}/tracks/{track}",
                          json={"track": track, "releases": [release]}), "Setting the track")

          set_track("completed")
          r = s.post(f"{api}/edits/{edit}:commit")
          # Until its first review passes, Play counts the app as a draft and takes only draft
          # releases on a track that is reviewed (alpha, beta, production): "Only releases with
          # status draft may be created on draft app". The same edit, bundle and all, then goes
          # in as a draft, which waits in Play Console until the owner sends it for review.
          draft = not r.ok and "draft app" in r.text
          if draft:
              set_track("draft")
              r = s.post(f"{api}/edits/{edit}:commit")
          check(r, "Committing")
          print(f"Uploaded {os.environ['APP_VERSION']} (version code {code}) to {track}"
                + (" as a draft" if draft else ""))
          if draft:
              print(f"::notice::The app is still a draft in Play Console, so this {track} release "
                    "is a draft. Open it in Play Console (Test and release → the track), check "
                    "it, then Publishing overview → Send changes for review.")
          PY

  # The bundle goes to Google Play and nowhere else: once it is uploaded, the run's copy goes
  # too (a public repository's artifacts can be downloaded by anyone signed in to GitHub). A
  # failed upload keeps it for its day, so the failed job can be rerun.
  forget:
    name: Forget the bundle
    needs: upload
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=android-bundle" \
            --jq '.artifacts[].id' | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > /dev/null
              echo "Deleted the bundle artifact."
            done

  # Tells the owner how the upload went, on their phone and by email (the admin page's Alerts
  # to you says which). The alert script is the one file fetched from the code repository's
  # main; it prints an HTTP code only. Nothing here can fail the run, and a cancelled run tells
  # nothing.
  tell:
    name: Tell the owner
    needs: [check, bundle, upload]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pocketgpu/pocketgpu
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          path: alert-script
          sparse-checkout: .github/owner-alert.sh
          sparse-checkout-cone-mode: false
      - name: Tell the owner
        env:
          PGPU_CHECKS_URL: ${{ vars.PGPU_PUSH_URL }}
          PGPU_CHECKS_TOKEN: ${{ secrets.PUSH_CHECKS_TOKEN }}
          UPLOADED: ${{ needs.upload.result }}
          CHECK: ${{ needs.check.result }}
          VERSION: ${{ needs.bundle.outputs.version || inputs.version }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ ! -f alert-script/.github/owner-alert.sh ]; then
            echo "main has no alert script yet: nothing sent."
            exit 0
          fi
          if [ "$UPLOADED" = success ]; then
            kind=release_finished
            text="Android $VERSION is uploaded to Google Play ($TRACK)."
            [ "$CHECK" != failure ] || text="$text The app check failed: look before trusting it."
          else
            kind=release_failed
            text="Android ${VERSION:-app} was not uploaded to Google Play ($TRACK)."
            [ "$CHECK" != failure ] || text="$text The app check failed too."
          fi
          sh alert-script/.github/owner-alert.sh "$kind" "$text Tap to open the run."
